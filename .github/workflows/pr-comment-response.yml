name: PR Comment Response

# Every review finding on a PR must carry a visible verdict reply — agreed
# (naming the commit), pushed back, or deliberately ignored. This job only
# AUDITS: it reads the PR and publishes a check run. It never writes a reply.
# See docs/superpowers/specs/2026-07-27-pr-comment-response-gate-design.md

on:
  # `edited` and `deleted` matter as much as `created`: a verdict reply that is
  # edited to remove its verdict, or deleted outright, must turn the gate red
  # again rather than leaving a stale green behind.
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # pull_request_target, not pull_request: a fork PR's `pull_request` token is
  # read-only and cannot create a check run. This job never checks out the
  # repository and never executes PR code — it reads the API and writes a check
  # run — so the usual pull_request_target risk does not apply.
  #
  # FORK LIMITATION: for a PR from a fork, the three comment/review events above
  # run from the PR merge commit with a read-only token, so publishing the check
  # fails (the job reports that explicitly rather than passing silently). Fork
  # PRs are still audited on every push via pull_request_target/synchronize,
  # which does carry a writable token. Same-repo branch PRs — how this repo
  # actually works — are covered by all four triggers.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-comment-response-${{ github.event.pull_request.number || github.event.issue.number }}
  # NOT cancel-in-progress: a burst of bot comments would cancel the earlier
  # runs, and a cancelled run reports as a FAILED check on the PR — the gate
  # would show red for a reason that has nothing to do with unanswered
  # findings. The audit takes seconds; let each event run to completion.
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR number
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "Could not resolve a PR number from event $EVENT_NAME." >&2
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # Only the auditor script is needed, so fetch it from the BASE repo at the
      # default branch rather than checking out the PR — a fork must not be able
      # to swap out the script that grades it.
      - name: Fetch the auditor from the base branch
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p dev-tools
          # Deliberately the DEFAULT branch, never the PR head: a PR must not be
          # able to swap out the script that grades it.
          # Distinguish "not there yet" from "could not ask". Only a genuine 404
          # means the gate is not installed; any other failure (rate limit, token
          # trouble, outage) must NOT disarm the gate — that would be a silent
          # fail-open, the one thing this whole check exists to prevent.
          HTTP=$(gh api "repos/$REPO/contents/dev-tools/pr-triage.js?ref=$DEFAULT_BRANCH" \
                   --jq '.content' > content.b64 2>err.txt; echo $?)
          if [ "$HTTP" = "0" ] && base64 --decode < content.b64 > dev-tools/pr-triage.js \
             && [ -s dev-tools/pr-triage.js ]; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q "HTTP 404" err.txt; then
            echo "::error::Could not fetch the auditor from $DEFAULT_BRANCH (not a 404). Refusing to disarm the gate."
            cat err.txt
            exit 1
          else
            # Expected exactly once: on the PR that introduces this gate, before
            # it exists on the default branch. Reporting "not installed" is
            # honest; claiming a pass would be a lie, and failing would block the
            # very PR that installs the gate.
            #
            # This is also the one bypass: deleting the auditor from the default
            # branch disarms the gate. That takes a visible commit to the
            # default branch, which is a deliberate act, not an oversight.
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "pr-triage.js is not on $DEFAULT_BRANCH yet; the gate is not active."
          fi

      - uses: actions/setup-node@v4
        if: steps.fetch.outputs.installed == 'true'
        with:
          node-version: '20'

      - name: Audit replies
        id: audit
        if: steps.fetch.outputs.installed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set +e
          node dev-tools/pr-triage.js audit --pr "$PR_NUMBER" > summary.md 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat summary.md

      - name: Publish the check run
        if: steps.fetch.outputs.installed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          case "$EXIT_CODE" in
            0) CONCLUSION=success; TITLE="All review findings have a verdict reply" ;;
            1) CONCLUSION=failure; TITLE="Review findings are waiting for a verdict reply" ;;
            # Exit 2 means the audit could not read the PR at all. That is not a
            # pass: an unreadable PR must never be reported as clean.
            *) CONCLUSION=failure; TITLE="Audit could not complete — treating as unanswered" ;;
          esac
          jq -n \
            --arg name "pr-comment-response" \
            --arg head_sha "$HEAD_SHA" \
            --arg conclusion "$CONCLUSION" \
            --arg title "$TITLE" \
            --rawfile summary summary.md \
            '{name: $name, head_sha: $head_sha, status: "completed",
              conclusion: $conclusion,
              output: {title: $title, summary: $summary}}' \
            > check.json
          if ! gh api --method POST "repos/$REPO/check-runs" --input check.json; then
            # Expected for a fork PR on comment/review events: those run with a
            # read-only token. Say so plainly instead of failing cryptically —
            # the pull_request_target push audit still covers the PR.
            echo "::error::Could not publish the pr-comment-response check run. If this PR is from a fork, comment/review events carry a read-only token; the check is published on push instead."
            exit 1
          fi

      - name: Report that the gate is not installed yet
        if: steps.fetch.outputs.installed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          jq -n \
            --arg head_sha "$HEAD_SHA" \
            --arg summary "\`dev-tools/pr-triage.js\` is not on \`$DEFAULT_BRANCH\` yet, so this gate is not active. It begins enforcing once the PR that adds it merges." \
            '{name: "pr-comment-response", head_sha: $head_sha, status: "completed",
              conclusion: "neutral",
              output: {title: "Gate not installed on the default branch yet", summary: $summary}}' \
            | gh api --method POST "repos/$REPO/check-runs" --input -

      - name: Fail the job when findings are unanswered
        if: steps.fetch.outputs.installed == 'true' && steps.audit.outputs.exit_code != '0'
        run: |
          echo "::error::Some review findings have no verdict reply. See the pr-comment-response check."
          exit 1
