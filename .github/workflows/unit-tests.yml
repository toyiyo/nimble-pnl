name: Unit Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Restrict GITHUB_TOKEN permissions to minimum required
permissions:
  contents: read
  pull-requests: read  # Required for SonarCloud PR decoration

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # ~7m45s on a warm runner now that the Sonar scan and the timezone matrix
    # each have their own job. The cap is a hang detector, not a performance
    # budget — leave room for the suite (665 files, 8197 tests) to keep growing.
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Vitest strips types with esbuild and never checks them, so a
      # `@ts-expect-error` in a test file passes whatever the type says. This
      # step compiles the type-assertion tests, which makes those directives
      # a real gate. See tsconfig.typetest.json.
      - name: Typecheck the type-assertion tests
        run: npm run typecheck:types

      - name: Run unit tests with coverage
        run: npm run test:coverage

      # Also consumed by the `sonarcloud` job below.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # The whole suite, re-run under timezones far from the host default, so a
  # date bug that only bites viewers outside the restaurant's zone fails here
  # rather than in production. `npm run test:tz` chains all three sequentially
  # for local use; in CI they fan out because chaining them behind the coverage
  # run put four full suites (~28 min) inside one 15-minute job — that combined
  # job was being cancelled at the cap on `main` too, not just on branches
  # (runs 30621297885, 30640491290, 30652161807). One job per zone also names
  # the failing zone in the check itself.
  timezone-matrix:
    name: Timezone Matrix (${{ matrix.tz }})
    runs-on: ubuntu-latest
    # ~7m per zone. Same hang-detector rationale as the `test` job above.
    timeout-minutes: 15
    strategy:
      # Every zone reports independently: a Chicago-only failure must not
      # hide whether Auckland and UTC are green.
      fail-fast: false
      matrix:
        # Chicago is behind UTC, Auckland ahead of it, and UTC is the zone
        # every naive `toISOString()` date bug silently passes under. Keep
        # this list in sync with the `test:tz` script in package.json.
        tz: [America/Chicago, Pacific/Auckland, UTC]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This job never writes to git, and `npm ci` below runs third-party
          # install scripts. Don't leave GITHUB_TOKEN in the git config for them.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests under ${{ matrix.tz }}
        run: npm run test
        env:
          TZ: ${{ matrix.tz }}

  # Kept out of the `test` job on purpose. When the two shared a job, a slow
  # or cancelled Sonar upload reported to PR authors as "Unit Tests: fail"
  # with the whole suite green (runs 30472141373, 30480912925). Two jobs, two
  # independent status checks.
  sonarcloud:
    name: SonarCloud
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube new-code detection

      # SonarJS resolves imported types through node_modules. The combined job
      # had them installed when the scan ran, so install them here too — the
      # split is meant to separate the two signals, not to quietly change what
      # the analysis can see.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `path: coverage/` on the upload stores that directory's *contents* at
      # the artifact root, so this restores `coverage/lcov.info` — the path
      # sonar-project.properties reads. Get it wrong and Sonar reports 0%
      # coverage on new code without logging a missing file.
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db-tests:
    name: Database Tests (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.65.5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start Supabase local database
        run: supabase start -x realtime,storage-api,imgproxy,inbucket,postgrest,pgadmin-schema-diff,migra,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Wait for database to be ready
        run: |
          echo "Waiting for database to be ready..."
          for i in {1..30}; do
            if supabase status | grep -q "DB URL"; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run database migrations
        run: supabase db reset --debug

      - name: Run pgTAP tests
        run: |
          cd supabase/tests
          chmod +x run_tests.sh
          ./run_tests.sh
        env:
          DB_HOST: localhost
          DB_PORT: 54322
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e-tests:
    name: E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.65.5

      - name: Start Supabase local database
        run: supabase start

      - name: Wait for Supabase to be ready
        run: |
          echo "Waiting for Supabase to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:54321/rest/v1/ > /dev/null 2>&1; then
              echo "Supabase is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run E2E tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx playwright test --project=e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          PLAYWRIGHT_WORKERS: 3
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          # Both values are the local Supabase CLI demo pair `supabase start`
          # creates above, published in the Supabase CLI docs. Neither is a
          # production secret. tests/helpers/e2e-service-role.ts reads these
          # two plain (non-VITE_-prefixed) names directly and throws if
          # either is absent, so both must be set for the E2E job to pass.
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-shard-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e-report:
    name: Merge E2E Reports
    if: always()
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
